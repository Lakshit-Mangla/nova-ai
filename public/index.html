<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova AI — your own AI chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle chat history">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="brand-name">Nova AI</span>
      </div>
      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New chat
      </button>
      <div id="conversation-list" class="conversation-list"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="brand mobile-only">
          <span class="brand-mark"><i></i><i></i><i></i></span>
          <span class="brand-name">Nova AI</span>
        </div>
      </header>

      <main class="chat-wrap">
        <div id="chat" class="chat">
          <div class="empty-state" id="empty-state">
            <h1>What's on your mind?</h1>
            <p>This is your own chat app, wired up to an AI model. Ask it anything.</p>
          </div>
        </div>
      </main>

      <footer class="composer-wrap">
        <form id="composer" class="composer">
          <textarea id="input" placeholder="Message Nova…" rows="1"></textarea>
          <button type="submit" id="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
        </form>
        <p class="hint">Enter to send · Shift+Enter for a new line</p>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
